services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # your app connects as root (DB_USER=root), so DB_PASSWORD becomes the root password
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      # runs once, on first start with an empty volume
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    # only reachable from the EC2 host itself; host nginx exposes it to the internet
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs

volumes:
  db_data:
  uploads:
  logs: