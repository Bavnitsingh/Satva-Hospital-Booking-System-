<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satva Admin — Hospital Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#10A37F",
              "primary-dark": "#0d8a6a",
              "bg-page": "#f0faf6",
            },
            fontFamily: {
              sans: ["'DM Sans'", "sans-serif"],
              display: ["'Playfair Display'", "serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #10a37f !important;
        box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.15);
      }
    </style>
  </head>
  <body class="bg-bg-page text-gray-800 min-h-screen">
    <main class="max-w-3xl mx-auto px-4 py-12">
      <a
        href="hospitals.html"
        class="text-sm font-semibold text-gray-500 hover:text-primary mb-6 inline-flex items-center gap-2"
      >
        &larr; Back to Hospitals
      </a>

      <div
        class="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden"
      >
        <div
          class="px-8 py-6 border-b border-gray-100 bg-gray-50 flex justify-between items-center"
        >
          <div>
            <h2 class="text-2xl font-bold text-gray-900" id="formTitle">
              Add New Hospital
            </h2>
            <p class="text-sm text-gray-500 mt-1">
              Enter the facility details below.
            </p>
          </div>
        </div>

        <form id="crudForm" class="p-8 space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="sm:col-span-2">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Hospital Name</label
              >
              <input
                type="text"
                id="name"
                required
                class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50"
                placeholder="e.g. Satva City Hospital"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Contact Email</label
              >
              <input
                type="email"
                id="email"
                required
                class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50"
                placeholder="admin@hospital.com"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Contact Phone</label
              >
              <input
                type="text"
                id="phone"
                required
                class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50"
                placeholder="9876543210"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >City</label
              >
              <input
                type="text"
                id="city"
                required
                class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50"
                placeholder="Ahmedabad"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Status</label
              >
              <select
                id="status"
                class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50"
              >
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="sm:col-span-2">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Complete Address</label
              >
              <textarea
                id="address"
                rows="3"
                class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50"
              ></textarea>
            </div>
          </div>

          <div class="pt-4 flex justify-end gap-3 border-t border-gray-100">
            <a
              href="hospitals.html"
              class="px-6 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50"
              >Cancel</a
            >
            <button
              type="submit"
              id="submitBtn"
              class="px-6 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-dark shadow-sm"
            >
              Save Hospital
            </button>
          </div>
        </form>
      </div>
    </main>

    <script>
      // Logic to determine if this is an Edit/View page based on URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const recordId = urlParams.get("id");
      const action = urlParams.get("action");

      if (recordId) {
        document.getElementById("formTitle").innerText =
          action === "view" ? "View Hospital Details" : "Edit Hospital Details";
        if (action === "edit")
          document.getElementById("submitBtn").innerText = "Update Hospital";

        if (action === "view") {
          document.getElementById("submitBtn").style.display = "none";
          document
            .querySelectorAll("input, select, textarea")
            .forEach((el) => (el.disabled = true));
        }

        // --- Fetch Data for existing record via API ---
        // fetch(`/api/hospitals/${recordId}`).then(res => res.json()).then(data => { populate form })
      }

      document
        .getElementById("crudForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            city: document.getElementById("city").value,
            status: document.getElementById("status").value,
            address: document.getElementById("address").value,
          };

          const method = recordId ? "PUT" : "POST";
          const url = recordId
            ? `/api/hospitals/${recordId}`
            : "/api/hospitals";

          console.log(`Submitting via ${method} to ${url}`, payload);
          // Execute fetch request here
          // await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          alert("Form Submitted successfully!");
          window.location.href = "hospitals.html";
        });
    </script>
  </body>
</html>
